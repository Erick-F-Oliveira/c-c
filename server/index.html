<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Teste de Salas - Cartas e Cristais</title>
</head>
<body>
<h1>Teste de Salas (Rooms)</h1>

<div>
    <label>Digite o Nome da Sala:</label>
    <input type="text" id="roomInput" value="mesa_1" />
    <button id="btnJoin">Entrar na Sala</button>
</div>

<br />

<button id="btnDraw" disabled>Sortear Inimigo para a Sala</button>

<div id="logs" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; background: #f9f9f9;">
    <p>Aguardando ações...</p>
</div>

<script src="http://localhost:3000/socket.io/socket.io.js"></script>
<script>
    const socket = io("http://localhost:3000");
    let currentRoom = "";

    const logs = document.querySelector("#logs");
    const btnDraw = document.querySelector("#btnDraw");

    // 1. Entrar na sala digitada
    document.querySelector("#btnJoin").addEventListener("click", () => {
        currentRoom = document.querySelector("#roomInput").value;
        socket.emit("join_room", currentRoom);
        logs.innerHTML += `<p>🟢 Solicitou entrada na sala: <b>${currentRoom}</b></p>`;
        btnDraw.disabled = false;
    });

    // 2. Pedir inimigo para a sala atual
    btnDraw.addEventListener("click", () => {
        socket.emit("request_enemy_for_room", currentRoom);
    });

    // 3. Receber aviso da sala
    socket.on("room_message", (msg) => {
        logs.innerHTML += `<p>📢 <b>Aviso da Sala:</b> ${msg}</p>`;
    });

    // 4. Receber o inimigo sorteado da sala
    socket.on("enemy_drawn", (data) => {
        logs.innerHTML += `
        <div style="border-top: 1px solid #ddd; margin-top: 5px;">
          <p>🐉 <b>Inimigo Sorteado:</b> ${data.enemy.name}</p>
          <small>Sorteado pelo Socket: ${data.drawnBy}</small>
        </div>
      `;
    });
</script>
</body>
</html>
